<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">CounterProof</title>
  <rect width="512" height="512" rx="96" fill="#0b0f14"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#1f2937" stroke-width="8"/>
  <!-- the promise: a check mark -->
  <path d="M132 268 L218 352 L330 196" fill="none" stroke="#e5e7eb" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the counterexample: the last stroke breaks -->
