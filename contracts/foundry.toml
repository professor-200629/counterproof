[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Monad support is native in Foundry >= 1.8 (forge 1.8.5 accepts this key).
network = "monad"

solc_version = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Source-verification settings from the Monad docs. The docs spell them
# `metadata = true` / `metadata_hash = "none"`; forge 1.8.5 reports those
# two keys as unknown, so the equivalent forge keys are used instead.
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true

# test/DependencyPins.t.sol reads only these two files, to fail the suite on a wrong library checkout.
fs_permissions = [
    { access = "read", path = "./lib/openzeppelin-contracts/package.json" },
    { access = "read", path = "./lib/forge-std/package.json" },
]

[lint]
# Deadlines are the point of this contract. Windows are minutes to days, so a few seconds of
# validator timestamp skew does not matter. Other lints stay on.
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
